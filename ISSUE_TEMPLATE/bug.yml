name: Bug
description: Something behaves differently from what it should.
title: "fix: <what is wrong>"
labels: ["bug"]
projects: ["estrngsa/6"]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happens
      description: Observed behaviour, with the exact error or output. Redact secrets, tokens and real names.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v1.2.3 or abc1234"
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Where
      options:
        - core (workstation)
        - edge (VPS)
        - gpu (gaming PC)
        - Local machine (CLI)
        - CI
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Suspected cause or files
      description: Optional. Regression test comes first when this is fixed.
    validations:
      required: false
